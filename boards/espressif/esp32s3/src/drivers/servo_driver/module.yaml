        # S2_PHY_ANGLE_MAX:
        #     description:
        #         short: Servo 2 physical angle maximum
        #         long: |
        #             Defines the maximum physical angle of the servo. This is used to limit the servo output to a certain range.
        #     type: int32
        #     unit: °
        #     min: -360
        #     max: 360
        #     default: 90

        S1_VOLTAGE_MIN:
            description:
                short: Servo 1 voltage minimum (adc raw value)
                long: |
                    Defines the minimum voltage of the servo. When pwm output at 500us, the voltage will be S1_VOLTAGE_MIN. This is used to limit the servo output to a certain range.
            type: int32
            min: 0
            max: 5000
            default: 0

        S1_VOLTAGE_MAX:
            description:
                short: Servo 1 voltage maximum (adc raw value)
                long: |
                    Defines the maximum voltage of the servo. When pwm output at 2500us, the voltage will be S1_VOLTAGE_MAX. This is used to limit the servo output to a certain range.
            type: int32
            min: 0
            max: 5000
            default: 4000

        S2_VOLTAGE_MIN:
            description:
                short: Servo 2 voltage minimum (adc raw value)
                long: |
                    Defines the minimum voltage of the servo. When pwm output at 500us, the voltage will be S2_VOLTAGE_MIN. This is used to limit the servo output to a certain range.
            type: int32
            min: 0
            max: 5000
            default: 0

        S2_VOLTAGE_MAX:
            description:
                short: Servo 2 voltage maximum (adc raw value)
                long: |
                    Defines the maximum voltage of the servo. When pwm output at 2500us, the voltage will be S2_VOLTAGE_MAX. This is used to limit the servo output to a certain range.
            type: int32
            min: 0
            max: 5000
            default: 4000

        SERVO_KP:
            description:
                short: Servo proportional gain
                long: |
                    Defines the proportional gain of the servo controller. This is used to adjust the response of the servo to the input signal.
            type: float
            decimal: 2
            increment: 0.01
            min: 0
            max: 100
            default: 1.6

        SERVO_KI:
            description:
                short: Servo integral gain
                long: |
                    Defines the integral gain of the servo controller. This is used to adjust the response of the
                    servo to the input signal. A higher integral gain will result in a faster response, but can also cause overshoot and instability.
            type: float
            decimal: 2
            increment: 0.01
            min: 0
            max: 100
            default: 0.3

        SERVO_KD:
            description:
                short: Servo derivative gain
                long: |
                    Defines the derivative gain of the servo controller. This is used to adjust the response of the
                    servo to the input signal. A higher derivative gain will result in a faster response, but can also cause overshoot and instability.
            type: float
            decimal: 2
            increment: 0.01
            min: 0
            max: 100
            default: 4

        SERVO_MAX_OUTPUT:
            description:
                short: Servo maximum output
                long: |
                    Defines the maximum output of the servo controller. This is used to limit the servo output to a certain range.
            type: int32
            unit: '%'
            min: 0
            max: 100
            default: 100
