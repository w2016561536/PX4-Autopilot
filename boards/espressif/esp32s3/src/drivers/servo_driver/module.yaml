module_name: Brushed Servo

parameters:
    - group: Brushed Servo
      definitions:
        SERVO_DRV_EN:
            description:
                short: Brushed servo driver enable
                long: |
                  Enable the brushed servo driver. This will disable the normal servo output and use the configured pins for the brushed servo output instead.
            type: boolean
            default: 1
            reboot_required: true

        SERVO1_INV:
            description:
                short: Servo 1 inversion
                long: |
                  Defines if the servo output is inverted.
                  If servo 1 is running continuously in the wrong direction, setting this to true can be a quick fix.
                  0: Normal output
                  1: Inverted output
            type: boolean
            default: 0

        SERVO2_INV:
            description:
                short: Servo 2 inversion
                long: |
                  Defines if the servo output is inverted.
                  If servo 2 is running continuously in the wrong direction, setting this to true can be a quick fix.
                  0: Normal output
                  1: Inverted output
            type: boolean
            default: 0

        SERVO1_OFFSET:
            description:
                short: Servo 1 offset
                long: |
                  Defines an offset for the servo output.
                  This can be used to adjust the neutral position of the servo.
            type: float
            decimal: 2
            increment: 0.01
            unit: '%'
            min: -100
            max: 100
            default: 0.0

        SERVO2_OFFSET:
            description:
                short: Servo 2 offset
                long: |
                  Defines an offset for the servo output.
                  This can be used to adjust the neutral position of the servo.
            type: float
            decimal: 2
            increment: 0.01
            unit: '%'
            min: -100
            max: 100
            default: 0.0

        SERVO1_BIND:
            description:
                short: Servo 1 binding
                long: |
                    Determine servo 1 bind to which main output
            type: enum
            values:
                0: MAIN1
                1: MAIN2
                2: MAIN3
                3: MAIN4
                4: MAIN5
                5: MAIN6
                6: MAIN7
                7: MAIN8
            default: 2

        SERVO2_BIND:
            description:
                short: Servo 2 binding
                long: |
                    Determine servo 2 bind to which main output
            type: enum
            values:
                0: MAIN1
                1: MAIN2
                2: MAIN3
                3: MAIN4
                4: MAIN5
                5: MAIN6
                6: MAIN7
                7: MAIN8
            default: 3

